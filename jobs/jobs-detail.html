<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../login.css">
</head>
<body>

    <header>
        <div id="navbar" class="obj-width">
            <a href="../login.html" class="logo-text">SkillSync</a>
            
            <ul id="menu">
                <li><a href="../login.html">Home</a></li>
                <li><a href="">Browse Jobs</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../contact.html">Contact</a></li>
                <li><a href="#login-section" id="w-btn">Join</a></li>
            </ul>
            <i id="bar" class='bx bx-menu'></i>
        </div>
    </header>

    <div id="jobDetails" class="extra-space obj-width">
        <p>Loading job details...</p>
    </div>

    <footer class="footer">
        </footer>

    <script src="job-list.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParam = new URLSearchParams(window.location.search);
            const index = urlParam.get("id");

            const jobDetailsContainer = document.getElementById('jobDetails');

            if (typeof jCategory !== 'undefined' && jCategory[index]) {
                const selectJob = jCategory[index];

                jobDetailsContainer.innerHTML = `
                    <div class="job-header">
                        <div class="job-img-row">
                            <img src="${selectJob.image}" alt="Company Logo">
                            <div>
                                <h2>${selectJob.companyName}</h2>
                                <span>${selectJob.location}</span>
                            </div>
                        </div>
                        <a id="g-btn" href="#">Apply Now</a>
                    </div>
                    <div class="features sec-space">
                        <div class="fe-box">
                            <div><img src="/vacancy.png" alt=""><h3>Vacancy</h3><p>${selectJob.vacancy}</p></div>
                            <div><img src="/fe 1.png" alt=""><h3>Position</h3><p>${selectJob.title}</p></div>
                            <div><img src="/hour.png" alt=""><h3>Hours</h3><p>${selectJob.hours}</p></div>
                            <div><img src="/salary.png" alt=""><h3>Salary</h3><p>${selectJob.rate}</p></div>
                        </div>
                    </div>
                    <div class="job-description sec-space">
                        <h3>Job Description</h3><p>${selectJob.description}</p>
                        <h3>Employment Status</h3><p>${selectJob.av}</p>
                        <h3>WorkPlace</h3><p>${selectJob.workplace}</p>
                        <h3>Educational Requirement</h3><p>${selectJob.education}</p>
                        <h3>Experience Requirements</h3><p>${selectJob.experience}</p>
                    </div>
                `;
            } else {
                console.error('Job data not found for index:', index);
                jobDetailsContainer.innerHTML = '<h2>Sorry, the requested job could not be found.</h2>';
            }
        });
    </script>

</body>
</html>
