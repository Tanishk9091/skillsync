<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 20px;
        }

        .container {
            border: 2px solid black;
            border-radius: 13px;
            background-color: rgba(0, 0, 0, 0.85);
            width: 350px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h3 {
            margin-top: 0;
            margin-bottom: 25px;
            color: bisque;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: bisque;
            font-size: 1.1rem;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid bisque;
            border-radius: 18px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            color: black;
        }

        input:focus {
            border-color: white;
            outline: none;
            background-color: white;
        }

        .form-btn {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(255, 228, 196, 0.2);
        }

        .form-btn:hover {
            background-color: bisque;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 228, 196, 0.3);
        }

        .form-footer {
            margin-top: 20px;
            font-size: 14px;
            color: bisque;
            text-align: center;
        }

        .form-footer a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .form-footer a:hover {
            color: bisque;
            text-decoration: none;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .form-help-text {
            color: rgba(255, 228, 196, 0.7);
            font-size: 12px;
            margin-top: 5px;
        }

        #signup-section {
            display: none;
        }

        .fade {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fade-in {
            opacity: 1;
        }</style>
</head>
<body>
    <main>
        <div id="login-section" class="container fade fade-in">
            <h3>Login To Your Account</h3>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" placeholder="Enter Your Email" id="login-email" required>
                    <div class="error-message" id="login-email-error"></div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" placeholder="Enter your Password" id="login-password" required>
                    <div class="error-message" id="login-password-error"></div>
                </div>
                <button type="submit" class="form-btn">Login</button>
                <p class="form-footer">Don't have an account? <a href="#" id="show-signup">Sign up here</a></p>
            </form>
        </div>

        <div id="signup-section" class="container fade">
            <h3>Create Your Account</h3>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-fullname">Full Name</label>
                    <input type="text" id="signup-fullname" placeholder="Enter your full name" required>
                    <div class="error-message" id="signup-fullname-error"></div>
                </div>
                <div class="form-group"> 
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                    <div class="error-message" id="signup-email-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Enter your password" required>
                    <small class="form-help-text">Password must be at least 8 characters long</small>
                    <div class="error-message" id="signup-password-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required>
                    <div class="error-message" id="signup-confirm-error"></div>
                </div>
                <button type="submit" class="form-btn">Sign Up</button>
                <p class="form-footer">Already have an account? <a href="#" id="show-login">Login here</a></p>
            </form>
        </div>
    </main>
</body>
</html>
