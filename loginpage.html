<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    /* Updated with a professional background image */
    background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
                url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=2070') no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
}

main {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    width: 100%;
}

.container {
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    background-color: rgba(28, 28, 30, 0.9);
    backdrop-filter: blur(10px);
    width: 100%;
    max-width: 420px; /* Use max-width for responsiveness */
    padding: 40px;
    box-sizing: border-box;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    transform: scale(1);
    transition: opacity 0.4s ease, transform 0.4s ease;
}

h3 {
    margin-top: 0;
    margin-bottom: 30px;
    color: #00A9FF; /* Light Blue Accent Color */
    text-align: center;
    font-size: 28px;
    font-weight: 700;
}

.form-group {
    margin-bottom: 25px;
    width: 100%;
    position: relative; /* Needed for positioning icons */
}

label {
    display: block;
    margin-bottom: 10px;
    font-weight: 500;
    color: #ffffff;
    font-size: 1.1rem;
}

input[type="email"],
input[type="password"],
input[type="text"] {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
    background-color: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    transition: all 0.3s ease;
}

.password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.password-wrapper input {
    width: 100%;
    padding-right: 45px; /* Make space for the icon */
}

.toggle-password {
    position: absolute;
    right: 15px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.6);
    transition: color 0.3s ease;
}

.toggle-password:hover {
    color: #00A9FF;
}


input::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

input:focus {
    border-color: #00A9FF; /* Light Blue Accent Color */
    outline: none;
    background-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 3px rgba(0, 169, 255, 0.2);
}

/* Style for invalid input fields */
input.is-invalid {
    border-color: #ff6b6b;
}

input.is-invalid:focus {
    box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
}

.form-btn {
    width: 100%;
    padding: 14px;
    background-color: #00A9FF; /* Light Blue Accent Color */
    color: #ffffff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 17px;
    font-weight: 600;
    margin-top: 25px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 169, 255, 0.3);
}

.form-btn:hover {
    background-color: #38B6FF; /* Lighter blue for hover */
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0, 169, 255, 0.4);
}

.form-footer {
    margin-top: 25px;
    font-size: 15px;
    color: rgba(255, 255, 255, 0.8);
    text-align: center;
}

.form-footer a {
    color: #00A9FF; /* Light Blue Accent Color */
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
}

.form-footer a:hover {
    color: #38B6FF; /* Lighter blue for hover */
    text-decoration: underline;
}

.error-message {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 8px;
    min-height: 15px; /* Reserve space to prevent layout shift */
    display: none; /* Hidden by default */
}

.error-message.show {
    display: block; /* Show when there is an error */
}


.form-help-text {
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    margin-top: 8px;
}

#signup-section {
    display: none;
}

.fade {
    opacity: 0;
    transform: scale(0.98);
}

.fade-in {
    opacity: 1;
    transform: scale(1);
}
    </style>
</head>
<body>
    <main>
        <div id="login-section" class="container fade fade-in">
            <h3>Login To Your Account</h3>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" placeholder="Enter Your Email" id="login-email" required>
                    <div class="error-message" id="login-email-error"></div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" placeholder="Enter your Password" id="login-password" required>
                        <span class="toggle-password">
                           <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z" clip-rule="evenodd" /></svg>
                        </span>
                    </div>
                    <div class="error-message" id="login-password-error"></div>
                </div>
                <button type="submit" class="form-btn">Login</button>
                <p class="form-footer">Don't have an account? <a href="#" id="show-signup">Sign up here</a></p>
            </form>
        </div>

        <div id="signup-section" class="container fade">
            <h3>Create Your Account</h3>
            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label for="signup-fullname">Full Name</label>
                    <input type="text" id="signup-fullname" placeholder="Enter your full name" required>
                    <div class="error-message" id="signup-fullname-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                    <div class="error-message" id="signup-email-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signup-password" placeholder="Enter your password" required minlength="8">
                        <span class="toggle-password">
                           <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z" clip-rule="evenodd" /></svg>
                        </span>
                    </div>
                    <small class="form-help-text">Password must be at least 8 characters long.</small>
                    <div class="error-message" id="signup-password-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                     <div class="password-wrapper">
                        <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required>
                        <span class="toggle-password">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z" clip-rule="evenodd" /></svg>
                        </span>
                    </div>
                    <div class="error-message" id="signup-confirm-error"></div>
                </div>
                <button type="submit" class="form-btn">Sign Up</button>
                <p class="form-footer">Already have an account? <a href="#" id="show-login">Login here</a></p>
            </form>
        </div>
    </main>
    <script src="loginpage.js"></script>
</body>
</html>
