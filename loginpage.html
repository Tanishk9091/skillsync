<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            /* Updated with the new, professional background image URL */
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), /* Slightly darker overlay */
                        url('') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            width: 100%;
        }

        .container {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background-color: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(10px);
            width: 400px;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h3 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #00A9FF; /* Light Blue Accent Color */
            text-align: center;
            font-size: 28px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 25px;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #ffffff;
            font-size: 1.1rem;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus {
            border-color: #00A9FF; /* Light Blue Accent Color */
            outline: none;
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(0, 169, 255, 0.2);
        }

        .form-btn {
            width: 100%;
            padding: 14px;
            background-color: #00A9FF; /* Light Blue Accent Color */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 600;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 169, 255, 0.3);
        }

        .form-btn:hover {
            background-color: #38B6FF; /* Lighter blue for hover */
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 169, 255, 0.4);
        }

        .form-footer {
            margin-top: 25px;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .form-footer a {
            color: #00A9FF; /* Light Blue Accent Color */
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .form-footer a:hover {
            color: #38B6FF; /* Lighter blue for hover */
            text-decoration: underline;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .form-help-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-top: 8px;
        }

        #signup-section {
            display: none;
        }

        .fade {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fade-in {
            opacity: 1;
        }
    </style>
</head>
<body>
    <main>
        <div id="login-section" class="container fade fade-in">
            <h3>Login To Your Account</h3>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" placeholder="Enter Your Email" id="login-email" required>
                    <div class="error-message" id="login-email-error"></div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" placeholder="Enter your Password" id="login-password" required>
                    <div class="error-message" id="login-password-error"></div>
                </div>
                <button type="submit" class="form-btn">Login</button>
                <p class="form-footer">Don't have an account? <a href="#" id="show-signup">Sign up here</a></p>
            </form>
        </div>

        <div id="signup-section" class="container fade">
            <h3>Create Your Account</h3>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-fullname">Full Name</label>
                    <input type="text" id="signup-fullname" placeholder="Enter your full name" required>
                    <div class="error-message" id="signup-fullname-error"></div>
                </div>
                <div class="form-group"> 
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                    <div class="error-message" id="signup-email-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Enter your password" required>
                    <small class="form-help-text">Password must be at least 8 characters long</small>
                    <div class="error-message" id="signup-password-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required>
                    <div class="error-message" id="signup-confirm-error"></div>
                </div>
                <button type="submit" class="form-btn">Sign Up</button>
                <p class="form-footer">Already have an account? <a href="#" id="show-login">Login here</a></p>
            </form>
        </div>
    </main>
    <script src="loginpage.js"></script>
</body>
</html>
